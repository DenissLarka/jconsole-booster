# Publishes JConsole Booster's modules to GitHub Packages when a release is published.
#
# The installers take the app's modules from Packages, so every box packages the same build. The build mirrors ci.yml:
# Zulu 27 with JavaFX bundled; druvu-lib-fx built from its release tag first, because this workflow's token cannot
# read another repository's packages; xvfb, because the UI tests start the JavaFX toolkit.
name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Read the druvu-lib-fx version from the pom
        id: kit
        run: echo "tag=v$(sed -n 's:.*<druvu-lib-fx.version>\(.*\)</druvu-lib-fx.version>.*:\1:p' jconsole-booster-fx/pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Check out druvu-lib-fx at that release tag
        uses: actions/checkout@v7
        with:
          repository: DenissLarka/druvu-lib-fx
          ref: ${{ steps.kit.outputs.tag }}
          path: druvu-lib-fx

      - name: Set up JDK 27 (Zulu, JavaFX bundled)
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'maven'
          server-id: github # the distributionManagement repository id in pom.xml
          settings-path: ${{ github.workspace }} # where setup-java writes settings.xml

      - name: Install druvu-lib-fx to the local repository
        run: mvn -B -f druvu-lib-fx/pom.xml install -DskipTests

      - name: Publish to GitHub Packages
        run: xvfb-run -a mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
