# Builds and verifies on every push to main and on every pull request.
# This is the gate that catches breakage (e.g. Renovate dependency bumps) before it lands on main:
# the publish workflow only runs on release, so without this a red build stays invisible until
# release time and Renovate PRs carry no status check.
#
# Temurin 25, matching maven-github-publish.yml, so CI verifies what a release publishes. Every
# dependency (druvu-lib-jmxmp included) resolves from Maven Central, so no registry auth is wired in.
# The Swing UI tests need a display: the build runs under xvfb (preinstalled on ubuntu-latest),
# because without one those tests skip rather than run.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify
        run: xvfb-run -a mvn -B verify
