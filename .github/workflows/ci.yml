# Builds and verifies on every push to main and on every pull request, so a red build (a Renovate bump, say) shows
# before it lands on main.
#
# The build runs on Zulu 27 with JavaFX bundled. druvu-lib-fx lives on GitHub Packages, which this workflow's token
# cannot read, so the kit is built first from the release tag that the pom's druvu-lib-fx.version names.
# The formatter does not run on JDK 27 yet, so the format is checked in its own step on JDK 25. The UI tests need a
# display: the build runs under xvfb.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Read the druvu-lib-fx version from the pom
        id: kit
        run: echo "tag=v$(sed -n 's:.*<druvu-lib-fx.version>\(.*\)</druvu-lib-fx.version>.*:\1:p' jconsole-booster-fx/pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Check out druvu-lib-fx at that release tag
        uses: actions/checkout@v7
        with:
          repository: DenissLarka/druvu-lib-fx
          ref: ${{ steps.kit.outputs.tag }}
          path: druvu-lib-fx

      - name: Set up JDK 25 and JDK 27 (Zulu, JavaFX bundled; 27 is the default)
        uses: actions/setup-java@v6
        with:
          java-version: |
            25
            27
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Install druvu-lib-fx to the local repository
        run: mvn -B -f druvu-lib-fx/pom.xml install -DskipTests

      - name: Build and verify
        run: xvfb-run -a mvn -B verify

      - name: Check the format on JDK 25
        run: JAVA_HOME="$JAVA_HOME_25_X64" mvn -B spotless:check
